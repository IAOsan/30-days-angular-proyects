@if (playerChoice) {
<p class="text-center">
  You choose
  <b class="text-secondary-900">{{ playerChoice | uppercase }}</b>
</p>
} @if (cpuChoice) {
<p class="text-center mb-5">
  Computer choose <b class="text-secondary-900">{{ cpuChoice | uppercase }}</b>
</p>
} @if(status !== 'idle' && playerChoice && cpuChoice) {
<p
  class="text-center pt-3 pb-3 pl-4 pr-4 rounded-1"
  [ngClass]="{
    'bg-success-100 text-success-900': status === 'won',
    'bg-warning-100 text-warning-900': status === 'draw',
    'bg-danger-100 text-danger-900': status === 'lose',
  }"
>
  <b>
    {{
      status === "draw"
        ? "DRAW 🤝"
        : status === "won"
        ? "YOU WON 🎉"
        : "YOU LOSE 😢"
    }}</b
  >
</p>
}
