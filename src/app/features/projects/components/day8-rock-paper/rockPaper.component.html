<main
  class="bg-info-600 d-flex flex-column align-items-center justify-content-center mh-100vh w-100"
>
  <div class="wrapper bg-light-50 pt-6 pb-6 pl-6 pr-6 rounded-2 shadow-1">
    <app-rock-paper-score />
    <app-rock-paper-options [moves]="moves" [onSelect]="handlePlayerMove.bind(this)" />
    <app-rock-paper-status [playerChoice]="playerChoice" [cpuChoice]="cpuChoice" [status]="status" />
  </div>
</main>
