<div class="d-flex justify-content-center gap-lg pt-6 pb-6 mt-6 mb-2">
  @for (move of moves; track move.id) {
  <button
    (click)="onSelect(move.id)"
    class="option heading-2 button button--secondary rounded-circle"
    [title]="move.name | capitalize"
    [aria-label]="`Select ${move.name}`"
  >
    {{ move.label }}
  </button>
  }
</div>
