<main
  class="bg-warning-400 d-flex flex-column align-items-center justify-content-center pt-6 pb-6 mh-100vh"
>
  <div class="d-inline-block">
    <tic-tac-toe-score-panel [players]="players" />
    <tic-tac-toe-turn-indicator [currentPlayer]="currentPlayer" [status]="status" />
    <tic-tac-toe-board
      [board]="board"
      [status]="status"
      (cellClicked)="handleCellClick($event)"
    />
    <tic-tac-toe-controls />
  </div>
</main>
